
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você foi escolhido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@preline/preline@2.0.0/dist/preline.min.js"></script>
    <style>
        body {
            background-color: #0a0a0a;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 0.8) 0%, rgba(0, 0, 0, 0.9) 100%),
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMwMDAwMDAiLz48ZyBvcGFjaXR5PSIwLjAzIj48cGF0aCBkPSJNLTEsLTFIMjAxVjIwMUgtMVoiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9nPjwvc3ZnPg==');
            background-blend-mode: overlay;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .pulse {
            animation: pulse 3s infinite;
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.1);
            }
            50% {
                box-shadow: 0 0 20px 10px rgba(255, 255, 255, 0.05);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.1);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-2xl mx-auto text-center">
        <div class="pulse bg-black/50 backdrop-blur-sm border border-gray-800 rounded-xl p-8 md:p-12 mb-8">
            <h1 class="text-3xl md:text-5xl font-bold mb-6 leading-tight">
                Você não entrou por acaso
            </h1>
            <p class="text-xl md:text-2xl mb-8">
                Existe algo acontecendo. Você vai ser um dos primeiros a descobrir.
            </p>
            <button 
                id="ctaButton"
                class="bg-gradient-to-r from-gray-800 to-gray-700 hover:from-gray-700 hover:to-gray-600 text-white font-bold py-4 px-8 rounded-full transition-all duration-300 transform hover:scale-105"
            >
                Quero saber antes de todo mundo
            </button>
        </div>
    </div>

    <!-- Modal -->
    <div id="signupModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-800 rounded-xl max-w-md w-full p-8 relative">
            <button id="closeModal" class="absolute top-4 right-4 text-gray-500 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            <h2 class="text-2xl font-bold mb-6">Você está quase lá</h2>
            <form id="signupForm" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium mb-1">Seu nome</label>
                    <input 
                        type="text" 
                        id="name" 
                        required 
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-600"
                    >
                </div>
                <div>
                    <label for="contact" class="block text-sm font-medium mb-1">Seu contato</label>
                    <input 
                        type="text" 
                        id="contact" 
                        required 
                        class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-600"
                    >
                </div>
                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-gray-800 to-gray-700 hover:from-gray-700 hover:to-gray-600 text-white font-bold py-3 px-4 rounded-lg transition-all duration-300"
                >
                    Confirmar participação
                </button>
            </form>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-800 rounded-xl max-w-md w-full p-8 text-center">
            <div class="mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold mb-4">Você agora faz parte</h2>
            <p class="mb-6">Guarde essa mensagem. Vai valer a pena no dia da reabertura.</p>
            <div class="bg-gray-800 rounded-lg p-4">
                <p class="text-sm text-gray-400 mb-2">Contagem regressiva para a revelação</p>
                <div id="countdown" class="text-2xl font-mono">
                    <span id="days">00</span>d <span id="hours">00</span>h <span id="minutes">00</span>m <span id="seconds">00</span>s
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set the date we're counting down to (30 days from now)
        const countDownDate = new Date();
        countDownDate.setDate(countDownDate.getDate() + 30);

        // Update the countdown every 1 second
        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            document.getElementById("days").innerHTML = days.toString().padStart(2, '0');
            document.getElementById("hours").innerHTML = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerHTML = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerHTML = seconds.toString().padStart(2, '0');
            
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "O momento chegou";
            }
        }, 1000);

        // Modal logic
        const ctaButton = document.getElementById('ctaButton');
        const signupModal = document.getElementById('signupModal');
        const closeModal = document.getElementById('closeModal');
        const signupForm = document.getElementById('signupForm');
        const successModal = document.getElementById('successModal');

        ctaButton.addEventListener('click', () => {
            signupModal.classList.remove('hidden');
        });

        closeModal.addEventListener('click', () => {
            signupModal.classList.add('hidden');
        });

        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            signupModal.classList.add('hidden');
            successModal.classList.remove('hidden');
        });

        // Close modals when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === signupModal) {
                signupModal.classList.add('hidden');
            }
            if (e.target === successModal) {
                successModal.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
